name: Build Shunno Get APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ShunnoGet.apk

      - name: Upload ShunnoGet APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoGet-APK
          path: release-apk/ShunnoGet.apk

      - name: Publish 1-Click Direct Download Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Shunno Get v1.0 (Direct 1-Click APK Download)"
          make_latest: true
          body: |
            ### 📲 Direct 1-Click Download for Android
            Tap the link below to download and install **Shunno Get** immediately:
            - **[Download ShunnoGet.apk](https://github.com/${{ github.repository }}/releases/latest/download/ShunnoGet.apk)**
          files: |
            release-apk/ShunnoGet.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
